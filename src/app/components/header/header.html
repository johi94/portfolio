<header class="header" [class.header--scrolled]="isScrolled()" [class.header--home]="isHome()">
  <div class="header__logo">
    <a routerLink="/" class="header__logo" aria-label="Zur Startseite">
  <app-logo class="header__logo-img" />
</a>
  </div>

  <nav class="header__nav">
    <ul class="header__menu">
      <li><a routerLink="/" fragment="about">{{ translation.t().about }}</a></li>
      <li><a routerLink="/" fragment="skills">{{ translation.t().skills }}</a></li>
      <li><a routerLink="/" fragment="work">{{ translation.t().work }}</a></li>
    </ul>

    <div class="header__lang">
      <button (click)="translation.setLang('DE')" [class.active]="translation.activeLang() === 'DE'">DE</button>
      <span>/</span>
      <button (click)="translation.setLang('EN')" [class.active]="translation.activeLang() === 'EN'">EN</button>
      <span>/</span>
      <button (click)="translation.setLang('ESP')" [class.active]="translation.activeLang() === 'ESP'">ESP</button>
    </div>
  </nav>
</header>
