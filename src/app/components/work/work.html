<section class="work" id="work">
  <div class="work__inner">
    <span class="work__circle work__circle--1" aria-hidden="true"></span>
    <span class="work__circle work__circle--2" aria-hidden="true"></span>
    <span class="work__circle work__circle--3" aria-hidden="true"></span>
    <span class="work__circle work__circle--4" aria-hidden="true"></span>
    <h2 class="work__title">{{ translation.t().titleWork }}</h2>
    <p class="work__subtitle">
      {{ translation.t().workSubtitle }}
    </p>
    <ul class="work__list">
      @for (project of projects; track project.title) {
        <li class="work__item">
          <img [src]="project.image" [alt]="project.title" class="work__image" />

          <div class="work__info">
            <h3 class="work__name">{{ project.title }}</h3>
            <p class="work__tech">{{ project.tech.join(' | ') }}</p>
            <p class="work__description">{{ translation.t()[project.descriptionKey] }}</p>
            <app-button [href]="project.githubUrl" target="_blank" size="large">Github</app-button>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
